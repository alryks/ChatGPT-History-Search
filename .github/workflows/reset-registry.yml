name: Reset legacy MCP image versions

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Remove legacy image package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="users/alryks/packages/container/chatgpt-history-search-mcp"
          gh api --paginate "$package/versions?per_page=100" --jq '.[] | {id, tags: .metadata.container.tags}'
          gh api --method DELETE "$package"
