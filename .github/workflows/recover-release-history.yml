name: Recover semantic release history

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  recover:
    name: Recover ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.0.0
            ref: 2ddedc1cadab46e6eece9b69958b492200474056
          - version: 1.0.1
            ref: b1aa8a4c3071c3f6c73d34ec200a05e571e4d8e7
          - version: 1.1.0
            ref: 9e6d6992f050ba42c6eb9e32e766037d25bb4cb9
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild historical release
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/alryks/chatgpt-history-search-mcp:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ChatGPT History Search MCP
            org.opencontainers.image.revision=${{ matrix.ref }}
            org.opencontainers.image.version=${{ matrix.version }}
          annotations: |
            index:org.opencontainers.image.version=${{ matrix.version }}
