name: chatgpt-history-search

services:
  mcp:
    build:
      context: .
    image: chatgpt-history-search-mcp:local
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - type: bind
        source: ${CODEX_CREDENTIALS_DIR:-${HOME}/.codex}
        target: /credentials
        read_only: true
    init: true
    restart: unless-stopped

  tunnel:
    image: ghcr.io/openai/tunnel-client:latest
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${TUNNEL_ID:?Set your Secure MCP Tunnel ID}
      CONTROL_PLANE_API_KEY: ${TUNNEL_API_KEY:?Set your tunnel runtime API key}
      MCP_SERVER_URL: http://mcp:8000/mcp
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    depends_on:
      mcp:
        condition: service_healthy
    init: true
    restart: unless-stopped

