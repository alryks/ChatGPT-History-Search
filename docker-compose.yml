name: chatgpt-history-search

services:
  mcp:
    image: ghcr.io/alryks/chatgpt-history-search-mcp:latest
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - type: bind
        source: ${CODEX_CREDENTIALS_DIR:-${HOME}/.codex}
        target: /credentials
        read_only: true
    init: true
    restart: unless-stopped

  tunnel:
    image: ghcr.io/openai/tunnel-client:latest
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${TUNNEL_ID:?Set your Secure MCP Tunnel ID}
      CONTROL_PLANE_API_KEY: ${TUNNEL_API_KEY:?Set your tunnel runtime API key}
      MCP_SERVER_URL: http://mcp:8000/mcp
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    depends_on:
      mcp:
        condition: service_healthy
    init: true
    restart: unless-stopped

