name: Tag current stable image as latest

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias latest to 1.1.0 without rebuilding
        run: docker buildx imagetools create --tag ghcr.io/alryks/chatgpt-history-search-mcp:latest ghcr.io/alryks/chatgpt-history-search-mcp:1.1.0
